[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "eval"]

[project]
name = "local-rag-server"
version = "0.1.0"
description = "本地大型 RAG 服务：供 Agent 调用的检索与生成基础设施"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "pymupdf>=1.25",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0",  # registry/迁移直接导入（显式声明，不依赖 sqlmodel 传递）
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    "celery>=5.4",
    "mcp>=1.2",  # apps/mcp（MCP 工具服务，核心运行时代码）
    "argon2-cffi>=23.1",  # core/security/admin（管理口令 Argon2id）
]

[project.optional-dependencies]
# 重型运行时依赖（torch/sentence-transformers/mineru）不走 extras：
# 本机 uv 0.11.13 不读 pyproject 索引配置（见 docs/spike/sm75-matrix.md §4），
# GPU 版 torch 只能 `uv pip install --index https://download.pytorch.org/whl/cu126` 安装；
# 若放进 extras，uv sync 会用 lock 中的 PyPI cpu 版覆盖 GPU 版。
# 这些包统一 pip 管理（README §Windows 本机 GPU），Phase 1 修复 uv 问题后再回归 lock 管理。
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "respx>=0.21",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["core", "apps", "eval"]
omit = ["core/config.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
# spike 为硬件实测工具（导入 torch/sentence-transformers GPU 栈），
# 依赖经 pip 安装不进 lock（见 dependencies 注释），CI 无 GPU 环境故排除类型检查
exclude = ["scripts/spike"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
