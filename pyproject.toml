[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "eval"]

[project]
name = "local-rag-server"
version = "0.1.0"
description = "本地大型 RAG 服务：供 Agent 调用的检索与生成基础设施"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "pymupdf>=1.25",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0",  # registry/迁移直接导入（显式声明，不依赖 sqlmodel 传递）
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    "celery>=5.4",
    "mcp>=1.2",  # apps/mcp（MCP 工具服务，核心运行时代码）
    "argon2-cffi>=23.1",  # core/security/admin（管理口令 Argon2id）
    "redis>=5.0",
]

[project.optional-dependencies]
# GPU/本地嵌入依赖需要手动 pip 安装，不走 extras：
#   uv sync --extra embed 会报错（embed 未定义），这是设计上的。
# 因为 GPU torch 必须从 PyTorch CUDA index 安装，若放进 extras，
# uv sync 会用 lock 中的 PyPI cpu 版覆盖 GPU 版（导致 CUDA unavailable）。
# 正确做法：先 pip install GPU torch，再 uv sync（lock 不会覆盖已安装的包）。

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "respx>=0.21",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["core", "apps", "eval"]
omit = ["core/config.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
# spike 为硬件实测工具（导入 torch/sentence-transformers GPU 栈），
# 依赖经 pip 安装不进 lock（见 dependencies 注释），CI 无 GPU 环境故排除类型检查
exclude = ["scripts/spike"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
